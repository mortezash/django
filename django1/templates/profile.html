{% if user.is_authenticated %}
    <p>سلام {{ user.username }} |
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">خروج</button>
    </form>
    
    </p>
{% else %}
    <a href="{% url 'login' %}">ورود</a> | <a href="{% url 'signup' %}">ثبت‌نام</a>
{% endif %}
